# Builds the Android app on a cloud machine and publishes an installable APK.
#  - Every push to main: builds the APK and attaches it to the "latest" GitHub Release
#    (Releases page → latest → Mirror.apk), plus the Actions run's artifacts.
#  - "Run workflow" on the Actions tab does the same on demand.

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: |
          set +e
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E "^e: |What went wrong|Could not|error:" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Mirror.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mirror-apk
          path: Mirror.apk

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Mirror.apk \
            --title "Mirror (build ${{ github.run_number }})" \
            --notes "Download Mirror.apk on your Android phone and open it to install. Built from ${GITHUB_SHA::7}." \
            --latest
